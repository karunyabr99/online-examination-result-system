# ExamFlow - Application Configuration
server.port=8080
server.error.include-message=always

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:examflow.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Default Admin Credentials (Local Demo Configuration)
# In production, these should be supplied via environment variables
examflow.admin.username=${ADMIN_USERNAME:admin}
examflow.admin.default-password=${ADMIN_PASSWORD:admin123}

# Application Metadata
examflow.app.name=ExamFlow
examflow.app.version=1.0.0
examflow.exam.default-pass-percentage=40.0

# Logging
logging.level.root=INFO
logging.level.com.examflow=DEBUG
logging.level.org.springframework.jdbc=INFO
